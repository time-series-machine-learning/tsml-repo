<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 56" width="206" height="56" role="img" aria-label="TSML Archive">
  <defs>
    <linearGradient id="tsml-red-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="tsml-blue-d" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Chart backdrop -->
  <rect x="2" y="2" width="52" height="52" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>

  <!-- Subtle horizontal grid lines -->
  <line x1="11" y1="18" x2="47" y2="18" stroke="#334155" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <line x1="11" y1="31" x2="47" y2="31" stroke="#334155" stroke-width="1" stroke-dasharray="2.5 2.5"/>

  <!-- Class A (coral/red) paired trajectories -->
  <path d="M 14 43 C 18 20, 23 18, 30 28 C 36 37, 41 35, 46 14" fill="none" stroke="#be123c" stroke-width="2.3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 13 38 C 17 15, 22 13, 29 24 C 35 33, 41 30, 46 10" fill="none" stroke="url(#tsml-red-d)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Class B (blue/cyan) paired trajectories -->
  <path d="M 14 41 C 22 43, 27 41, 29 29 C 31 18, 37 19, 47 26" fill="none" stroke="#0369a1" stroke-width="2.3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 13 37 C 21 39, 26 37, 28 25 C 30 14, 37 15, 47 22" fill="none" stroke="url(#tsml-blue-d)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- L-shaped chart axes -->
  <path d="M 10 9 L 10 46 L 48 46" fill="none" stroke="#f8fafc" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Prominent TSML wordmark -->
  <text x="65" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" font-style="italic" letter-spacing="-1.2" fill="#f8fafc">TSML</text>
</svg>
